    <meta charset="UTF-8" />

    <meta name="theme-color" content="#13875f" />

    <title>Înscrierile s-au mutat pe WhatsApp · Fotbal de miercuri</title>
    <script>
      (() => {
        let storedTheme;
        try { storedTheme = localStorage.getItem("theme"); } catch {}
        document.documentElement.dataset.theme = storedTheme ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      })();
    </script>
    <link rel="icon" href="/app-icon.svg?v=20260923-1" type="image/svg+xml" />

          <path d="M27 15a11 11 0 0 1-16 9.8L5 27l2.2-6A11 11 0 1 1 27 15Z" />
